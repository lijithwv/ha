overhead_flights:
  photo_contact: !secret overhead_planespotters_contact

rest_command:
  overhead_flights_fetch:
    url: https://api.adsb.lol/v2/point/-37.612497476096884/145.04686508190858/14
    timeout: 20

template:
  - triggers:
      - trigger: event
        event_type: overhead_flights_updated
    sensor:
      - name: Overhead Aircraft Snapshot
        unique_id: overhead_aircraft_snapshot
        icon: mdi:airplane
        state: "{{ trigger.event.data.payload.get('now', 0) }}"
        availability: "{{ trigger.event.data.ok }}"
        attributes:
          ac: "{{ trigger.event.data.payload.get('ac', []) }}"
          now: "{{ trigger.event.data.payload.get('now', 0) }}"
          http_status: "{{ trigger.event.data.status }}"

recorder:
  exclude:
    entities:
      - sensor.overhead_aircraft_snapshot
