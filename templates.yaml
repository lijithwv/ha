- cover:
  - open_cover:
    - action: rest_command.garage_open
    close_cover:
    - action: rest_command.garage_close
    stop_cover:
    - action: rest_command.garage_stop
    default_entity_id: cover.smart_garage
    name: Garage Door
    state: >
      {% set door = states('sensor.garage_status') | lower %}
      {% if 'closing' in door %}
        closing
      {% elif 'opening' in door %}
        opening
      {% elif 'closed' in door %}
        closed
      {% elif 'open' in door %}
        open
      {% else %}
        unknown
      {% endif %}
- trigger:
  - platform: time_pattern
    minutes: "/1"
  sensor:
    - name: "Garage Status Last Changed"
      icon: mdi:calendar
      state: >
        {% set dt = state_attr('sensor.garage_status', 'dt') %}
        {% set utc_date = strptime(dt, "%Y-%m-%d %H:%M:%S").strftime("%Y-%m-%dT%H:%M:%SZ") %}
        {% set exact_time = utc_date | as_timestamp | timestamp_custom('%H:%M %p') %}
        {% set rel_time = relative_time(as_datetime(utc_date))  %}
        {{ exact_time }} - {{ rel_time }} ago
- trigger:
  - platform: time_pattern
    minutes: "/1"
  sensor:
    - name: "Garage Door Simple"
      state: >
        {% set door = states('sensor.garage_status') | lower %}
        {% if 'closing' in door %}
          closing
        {% elif 'opening' in door %}
          opening
        {% elif 'closed' in door %}
          closed
        {% elif 'open' in door %}
          open
        {% else %}
          unknown
        {% endif %}
- sensor:
  - name: "Garage Diagnostic Error"
    icon: mdi:alert-circle
    state: >
      {{ state_attr('sensor.garage_status', 'error') | default('unknown', true) }}
  - name: "Garage Diagnostic Camera"
    icon: mdi:camera
    state: >
      {{ state_attr('sensor.garage_status', 'camera') | default('unknown', true) }}

# One status entity for every Reolink camera protecting the property perimeter.
# Trigger-based so last_non_clear_camera is retained after detection clears.
- trigger:
  - platform: state
    entity_id:
      - binary_sensor.reolink_video_doorbell_poe_person
      - binary_sensor.garage_front_person
      - binary_sensor.west_person
      - binary_sensor.east_person
      - binary_sensor.backyard_person
  - platform: homeassistant
    event: start
  sensor:
  - name: "Perimeter Status"
    unique_id: perimeter_status
    icon: >
      {% set cameras = [
        'binary_sensor.reolink_video_doorbell_poe_person',
        'binary_sensor.garage_front_person',
        'binary_sensor.west_person',
        'binary_sensor.east_person',
        'binary_sensor.backyard_person'
      ] %}
      {% if cameras | select('is_state', 'on') | list | count > 0 %}
        mdi:shield-alert
      {% elif cameras | select('is_state', 'unavailable') | list | count > 0
          or cameras | select('is_state', 'unknown') | list | count > 0 %}
        mdi:shield-off-outline
      {% else %}
        mdi:shield-check
      {% endif %}
    state: >
      {% set cameras = [
        'binary_sensor.reolink_video_doorbell_poe_person',
        'binary_sensor.garage_front_person',
        'binary_sensor.west_person',
        'binary_sensor.east_person',
        'binary_sensor.backyard_person'
      ] %}
      {% set active = cameras | select('is_state', 'on') | list | count %}
      {% set offline = cameras | select('is_state', 'unavailable') | list | count
        + cameras | select('is_state', 'unknown') | list | count %}
      {% if active > 0 %}
        Not clear
      {% elif offline > 0 %}
        Status unknown
      {% else %}
        Clear
      {% endif %}
    attributes:
      cameras_monitored: 5
      current_non_clear_camera: >
        {% set cameras = {
          'binary_sensor.reolink_video_doorbell_poe_person': 'Doorbell',
          'binary_sensor.garage_front_person': 'Garage Front',
          'binary_sensor.west_person': 'West',
          'binary_sensor.east_person': 'East',
          'binary_sensor.backyard_person': 'Backyard'
        } %}
        {% set ns = namespace(active=[]) %}
        {% for entity, name in cameras.items() %}
          {% if is_state(entity, 'on') %}
            {% set ns.active = ns.active + [name] %}
          {% endif %}
        {% endfor %}
        {{ ns.active | join(', ') if ns.active else 'None' }}
      last_non_clear_camera: >
        {% set names = {
          'binary_sensor.reolink_video_doorbell_poe_person': 'Doorbell',
          'binary_sensor.garage_front_person': 'Garage Front',
          'binary_sensor.west_person': 'West',
          'binary_sensor.east_person': 'East',
          'binary_sensor.backyard_person': 'Backyard'
        } %}
        {% if trigger.platform == 'state' and trigger.to_state.state == 'on' %}
          {{ names.get(trigger.entity_id, trigger.to_state.name) }}
        {% else %}
          {{ this.attributes.get('last_non_clear_camera', 'None') }}
        {% endif %}
      last_non_clear_since: >
        {% if trigger.platform == 'state' and trigger.to_state.state == 'on' %}
          {{ trigger.to_state.last_changed.isoformat() }}
        {% else %}
          {{ this.attributes.get('last_non_clear_since', 'unknown') }}
        {% endif %}
      active_detections: >
        {% set cameras = [
          'binary_sensor.reolink_video_doorbell_poe_person',
          'binary_sensor.garage_front_person',
          'binary_sensor.west_person',
          'binary_sensor.east_person',
          'binary_sensor.backyard_person'
        ] %}
        {{ cameras | select('is_state', 'on') | list | count }}
      unavailable_cameras: >
        {% set cameras = [
          'binary_sensor.reolink_video_doorbell_poe_person',
          'binary_sensor.garage_front_person',
          'binary_sensor.west_person',
          'binary_sensor.east_person',
          'binary_sensor.backyard_person'
        ] %}
        {{ cameras | select('is_state', 'unavailable') | list | count
          + cameras | select('is_state', 'unknown') | list | count }}
