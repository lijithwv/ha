- cover:
  - open_cover:
    - action: rest_command.garage_open
    close_cover:
    - action: rest_command.garage_close
    stop_cover:
    - action: rest_command.garage_stop
    default_entity_id: cover.smart_garage
    name: Garage Door
    state: >
      {% set door = states('sensor.garage_status') | lower %}
      {% if 'closing' in door %}
        closing
      {% elif 'opening' in door %}
        opening
      {% elif 'closed' in door %}
        closed
      {% elif 'open' in door %}
        open
      {% else %}
        unknown
      {% endif %}
- trigger:
  - platform: time_pattern
    minutes: "/1"
  sensor:
    - name: "Garage Status Last Changed"
      icon: mdi:calendar
      state: >
        {% set dt = state_attr('sensor.garage_status', 'dt') %}
        {% set utc_date = strptime(dt, "%Y-%m-%d %H:%M:%S").strftime("%Y-%m-%dT%H:%M:%SZ") %}
        {% set exact_time = utc_date | as_timestamp | timestamp_custom('%H:%M %p') %}
        {% set rel_time = relative_time(as_datetime(utc_date))  %}
        {{ exact_time }} - {{ rel_time }} ago
- trigger:
  - platform: time_pattern
    minutes: "/1"
  sensor:
    - name: "Garage Door Simple"
      state: >
        {% set door = states('sensor.garage_status') | lower %}
        {% if 'closing' in door %}
          closing
        {% elif 'opening' in door %}
          opening
        {% elif 'closed' in door %}
          closed
        {% elif 'open' in door %}
          open
        {% else %}
          unknown
        {% endif %}
- sensor:
  - name: "Garage Diagnostic Error"
    icon: mdi:alert-circle
    state: >
      {{ state_attr('sensor.garage_status', 'error') | default('unknown', true) }}
  - name: "Garage Diagnostic Camera"
    icon: mdi:camera
    state: >
      {{ state_attr('sensor.garage_status', 'camera') | default('unknown', true) }}

# One status entity for every Reolink camera protecting the property perimeter.
# Trigger-based so last_non_clear_camera is retained after detection clears.
- trigger:
  - platform: state
    entity_id:
      - binary_sensor.reolink_video_doorbell_poe_person
      - binary_sensor.garage_front_person
      - binary_sensor.west_person
      - binary_sensor.east_person
      - binary_sensor.backyard_person
  - platform: homeassistant
    event: start
  sensor:
  - name: "Perimeter Status"
    unique_id: perimeter_status
    icon: >
      {% set cameras = [
        'binary_sensor.reolink_video_doorbell_poe_person',
        'binary_sensor.garage_front_person',
        'binary_sensor.west_person',
        'binary_sensor.east_person',
        'binary_sensor.backyard_person'
      ] %}
      {% if cameras | select('is_state', 'on') | list | count > 0 %}
        mdi:shield-alert
      {% elif cameras | select('is_state', 'unavailable') | list | count > 0
          or cameras | select('is_state', 'unknown') | list | count > 0 %}
        mdi:shield-off-outline
      {% else %}
        mdi:shield-check
      {% endif %}
    state: >
      {% set cameras = [
        'binary_sensor.reolink_video_doorbell_poe_person',
        'binary_sensor.garage_front_person',
        'binary_sensor.west_person',
        'binary_sensor.east_person',
        'binary_sensor.backyard_person'
      ] %}
      {% set active = cameras | select('is_state', 'on') | list | count %}
      {% set offline = cameras | select('is_state', 'unavailable') | list | count
        + cameras | select('is_state', 'unknown') | list | count %}
      {% if active > 0 %}
        Not clear
      {% elif offline > 0 %}
        Status unknown
      {% else %}
        Clear
      {% endif %}
    attributes:
      cameras_monitored: 5
      current_non_clear_camera: >
        {% set cameras = {
          'binary_sensor.reolink_video_doorbell_poe_person': 'Doorbell',
          'binary_sensor.garage_front_person': 'Garage Front',
          'binary_sensor.west_person': 'West',
          'binary_sensor.east_person': 'East',
          'binary_sensor.backyard_person': 'Backyard'
        } %}
        {% set ns = namespace(active=[]) %}
        {% for entity, name in cameras.items() %}
          {% if is_state(entity, 'on') %}
            {% set ns.active = ns.active + [name] %}
          {% endif %}
        {% endfor %}
        {{ ns.active | join(', ') if ns.active else 'None' }}
      last_non_clear_camera: >
        {% set names = {
          'binary_sensor.reolink_video_doorbell_poe_person': 'Doorbell',
          'binary_sensor.garage_front_person': 'Garage Front',
          'binary_sensor.west_person': 'West',
          'binary_sensor.east_person': 'East',
          'binary_sensor.backyard_person': 'Backyard'
        } %}
        {% if trigger.platform == 'state' and trigger.to_state.state == 'on' %}
          {{ names.get(trigger.entity_id, trigger.to_state.name) }}
        {% else %}
          {{ this.attributes.get('last_non_clear_camera', 'None') }}
        {% endif %}
      last_non_clear_since: >
        {% if trigger.platform == 'state' and trigger.to_state.state == 'on' %}
          {{ trigger.to_state.last_changed.isoformat() }}
        {% else %}
          {{ this.attributes.get('last_non_clear_since', 'unknown') }}
        {% endif %}
      active_detections: >
        {% set cameras = [
          'binary_sensor.reolink_video_doorbell_poe_person',
          'binary_sensor.garage_front_person',
          'binary_sensor.west_person',
          'binary_sensor.east_person',
          'binary_sensor.backyard_person'
        ] %}
        {{ cameras | select('is_state', 'on') | list | count }}
      unavailable_cameras: >
        {% set cameras = [
          'binary_sensor.reolink_video_doorbell_poe_person',
          'binary_sensor.garage_front_person',
          'binary_sensor.west_person',
          'binary_sensor.east_person',
          'binary_sensor.backyard_person'
        ] %}
        {{ cameras | select('is_state', 'unavailable') | list | count
          + cameras | select('is_state', 'unknown') | list | count }}

# Daily garage-front vehicle statistics. A new Frigate tracked car increments the
# total when the garage camera's car occupancy changes from clear to occupied.
# Recognized number plates are retained as a de-duplicated list for the day.
- trigger:
  - platform: state
    entity_id: binary_sensor.garage_cam_car_occupancy
    from: "off"
    to: "on"
    id: car_seen
  - platform: state
    entity_id: sensor.garage_cam_last_recognized_plate
    id: plate_seen
  - platform: time
    at: "00:00:00"
    id: midnight
  - platform: homeassistant
    event: start
    id: startup
  sensor:
  - name: "Garage Front Cars Today"
    unique_id: garage_front_cars_today
    icon: mdi:car-multiple
    unit_of_measurement: cars
    state_class: total
    state: >
      {% set same_day = this.attributes.get('counter_date', '') == now().date() | string %}
      {% set previous = this.state | int(0) if same_day else 0 %}
      {{ previous + 1 if trigger.id == 'car_seen' else previous }}
    attributes:
      counter_date: "{{ now().date() }}"
      unique_cars: >
        {% set same_day = this.attributes.get('counter_date', '') == now().date() | string %}
        {% set plates = this.attributes.get('recognized_plates', []) if same_day else [] %}
        {% set plate = trigger.to_state.state | upper | trim
          if trigger.id == 'plate_seen' and trigger.to_state is not none else '' %}
        {% if plate not in ['', 'UNKNOWN', 'UNAVAILABLE', 'NONE', 'NULL'] and plate not in plates %}
          {{ (plates + [plate]) | count }}
        {% else %}
          {{ plates | count }}
        {% endif %}
      recognized_plates: >
        {% set same_day = this.attributes.get('counter_date', '') == now().date() | string %}
        {% set plates = this.attributes.get('recognized_plates', []) if same_day else [] %}
        {% set plate = trigger.to_state.state | upper | trim
          if trigger.id == 'plate_seen' and trigger.to_state is not none else '' %}
        {% if plate not in ['', 'UNKNOWN', 'UNAVAILABLE', 'NONE', 'NULL'] and plate not in plates %}
          {{ plates + [plate] }}
        {% else %}
          {{ plates }}
        {% endif %}
      recognized_passes: >
        {% set same_day = this.attributes.get('counter_date', '') == now().date() | string %}
        {% set previous = this.attributes.get('recognized_passes', 0) | int(0) if same_day else 0 %}
        {% set plate = trigger.to_state.state | upper | trim
          if trigger.id == 'plate_seen' and trigger.to_state is not none else '' %}
        {{ previous + 1 if plate not in ['', 'UNKNOWN', 'UNAVAILABLE', 'NONE', 'NULL'] else previous }}
      last_plate: >
        {% set same_day = this.attributes.get('counter_date', '') == now().date() | string %}
        {% set plate = trigger.to_state.state | upper | trim
          if trigger.id == 'plate_seen' and trigger.to_state is not none else '' %}
        {% if plate not in ['', 'UNKNOWN', 'UNAVAILABLE', 'NONE', 'NULL'] %}
          {{ plate }}
        {% elif same_day %}
          {{ this.attributes.get('last_plate', 'None') }}
        {% else %}
          None
        {% endif %}
      last_vehicle_seen: >
        {% set same_day = this.attributes.get('counter_date', '') == now().date() | string %}
        {% if trigger.id == 'car_seen' %}
          {{ now().isoformat() }}
        {% elif same_day %}
          {{ this.attributes.get('last_vehicle_seen', 'unknown') }}
        {% else %}
          unknown
        {% endif %}

- sensor:
  - name: "Garage Front Unique Cars Today"
    unique_id: garage_front_unique_cars_today
    icon: mdi:car-info
    unit_of_measurement: cars
    state_class: measurement
    state: "{{ state_attr('sensor.garage_front_cars_today', 'unique_cars') | int(0) }}"
  - name: "Garage Front Recognized Passes Today"
    unique_id: garage_front_recognized_passes_today
    icon: mdi:car-search
    unit_of_measurement: cars
    state_class: measurement
    state: "{{ state_attr('sensor.garage_front_cars_today', 'recognized_passes') | int(0) }}"
  - name: "Garage Front Unidentified Cars Today"
    unique_id: garage_front_unidentified_cars_today
    icon: mdi:car-off
    unit_of_measurement: cars
    state_class: measurement
    state: >
      {% set total = states('sensor.garage_front_cars_today') | int(0) %}
      {% set recognized = state_attr('sensor.garage_front_cars_today', 'recognized_passes') | int(0) %}
      {{ [total - recognized, 0] | max }}
